version: '3.8'
services:
  db:
    build: .
    container_name: pg_banking_pro
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: banking_db
    ports:
      - "5433:5432" # Внешний порт 5433 -> Внутренний 5432
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
